name: Build & Release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript, Lint & Tests
        run: |
          npx tsc --noEmit
          npm run lint
          npm test

      - name: Build static web export for Capacitor
        run: npm run build:mobile

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DompetKu-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DompetKu-APK
          path: DompetKu-debug.apk

      - name: Publish APK to GitHub Release (Deployments)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: DompetKu Android APK (Latest)
          body: |
            Build otomatis Android APK (Offline-First + Auto-Sync) dari commit `${{ github.sha }}`.
            Download `DompetKu-debug.apk` di bawah untuk install di Android.
          files: DompetKu-debug.apk
          prerelease: false
          make_latest: true
